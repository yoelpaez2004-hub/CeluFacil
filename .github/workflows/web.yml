name: Publicar web

# Publica la web para clientes (carpeta web/) en GitHub Pages. Se vuelve a publicar sola cuando cambiás la web,
# la base de datos de la app (data.js) o cuando el robot actualiza los precios de Mercado Libre.
# Una sola vez: Settings → Pages → Source: "GitHub Actions". La web queda en https://<usuario>.github.io/CeluFacil/
on:
  push:
    branches: [ main ]
    paths: [ 'web/**', 'www/data.js', 'www/precios-ml.json', 'www/marcas/**', 'www/iconos/**', 'www/modelos/**', 'scripts/build-web.mjs', '.github/workflows/web.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Armar la web
        run: node scripts/build-web.mjs dist/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/web }
      - id: deploy
        uses: actions/deploy-pages@v4
